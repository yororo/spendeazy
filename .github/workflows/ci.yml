name: Validate API, PostgreSQL and mobile

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_failure:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: true

jobs:
  preflight:
    name: Check validation request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise failed-validation gate
        env:
          FORCE_FAILURE: ${{ inputs.force_failure }}
        run: test "$FORCE_FAILURE" != true

  api:
    needs: [preflight]
    name: Validate API and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spendeazy_test
          POSTGRES_USER: spendeazy_test_user
          POSTGRES_PASSWORD: spendeazy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendeazy_test_user -d spendeazy_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_SPACES_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_spaces
      TEST_CATEGORY_RULES_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_category_rules
      TEST_CATEGORY_COLOR_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_category_colors
      TEST_SPACE_CATEGORIES_CONCURRENCY_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_space_categories_concurrency
      TEST_STATEMENT_IMPORT_ROLLBACK_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_statement_import_rollback
      TEST_STATEMENT_IMPORT_CATEGORY_CONCURRENCY_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_statement_import_category_concurrency
      TEST_EXPENSE_STATEMENT_IMPORT_SPACE_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_expense_statement_import_space
      TEST_INVITATIONS_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_invitations
      TEST_FINANCIAL_OWNERSHIP_MIGRATION_DATABASE_URL: postgres://spendeazy_test_user:spendeazy_test_password@localhost:5432/spendeazy_test_financial_ownership_migration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Create a separate database for every integration suite
        run: |
          for database in \
            spendeazy_test_spaces \
            spendeazy_test_category_rules \
            spendeazy_test_category_colors \
            spendeazy_test_space_categories_concurrency \
            spendeazy_test_statement_import_rollback \
            spendeazy_test_statement_import_category_concurrency \
            spendeazy_test_expense_statement_import_space \
            spendeazy_test_invitations \
            spendeazy_test_financial_ownership_migration; do
            createdb --host localhost --username spendeazy_test_user "$database"
          done
        env:
          PGPASSWORD: spendeazy_test_password
      - name: Verify release gates and planner
        run: |
          node scripts/verify-release-gates.mjs
          node --test scripts/release-plan.test.mjs scripts/local-test-launcher.test.mjs
        env:
          CI: true
      - name: Test PostgreSQL test-runner configuration
        run: node --test scripts/run-required-postgres-tests.test.mjs
        working-directory: api
      - name: Lint API
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        working-directory: api
      - name: Build API
        run: npm run build
        working-directory: api
      - name: Verify production migration image
        run: npm run test:migration-image
        working-directory: api
      - name: Test API unit behavior
        run: npm test -- --runInBand
        working-directory: api
      - name: Test API HTTP and PostgreSQL behavior
        run: npm run test:postgres
        working-directory: api
      - name: Check API contract artifacts
        run: npm run openapi:check
        working-directory: api

  mobile:
    needs: [preflight]
    name: Validate mobile and parser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
        working-directory: mobile-app
      - name: Check fictional parser and Category Rule fixtures
        run: npm run parser:test
        working-directory: mobile-app
      - name: Lint mobile
        run: npm run lint
        working-directory: mobile-app
      - name: Type-check mobile
        run: npm run typecheck
        working-directory: mobile-app

  validate:
    name: All validation passed
    needs: [preflight, api, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORCE_FAILURE: ${{ inputs.force_failure }}
        run: |
          test "$FORCE_FAILURE" != true
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
