name: Validate Spendeazy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate projects and isolated browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SPENDEAZY_E2E_TEST_CLOCK: 2026-09-19T12:00:00.000Z
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint API
        run: npm run lint
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Test API
        run: npm test -- --runInBand
        working-directory: api

      - name: Check API contract artifacts
        run: npm run openapi:check
        working-directory: api

      - name: Lint web
        run: npm run lint
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Test web
        run: npm test -- --run
        working-directory: web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run isolated browser suite
        run: node scripts/local-test-launcher.mjs --e2e
