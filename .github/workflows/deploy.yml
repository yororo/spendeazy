name: Deploy Spendeazy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      project:
        description: Project to deploy
        type: choice
        default: all
        options: [all, web, api]
      verify_only:
        description: Exercise release gates without publishing to Azure
        type: boolean
        default: false
      fail_validation:
        description: Deliberately fail validation in verification mode only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # Validation is cancellable and never holds the publication lock.
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.event.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    with:
      force_failure: ${{ inputs.verify_only == true && inputs.fail_validation == true }}

  gate:
    # Preserve main's existing required status-check identity.
    name: Validate projects and isolated browser suite
    needs: [validate]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success

  publish:
    needs: [validate, gate]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (needs.gate.result == 'success' && needs.validate.result == 'success'))
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      project: ${{ inputs.project || 'all' }}
      verify_only: ${{ inputs.verify_only == true }}
      validated: ${{ needs.gate.result == 'success' && needs.validate.result == 'success' }}
      web_artifact_id: ${{ needs.validate.outputs.web_artifact_id }}
