name: Deploy API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Exercise release gates without publishing to Azure
        type: boolean
        default: false
      fail_validation:
        description: Deliberately fail validation in verification mode only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    # Validation is cancellable and never holds the publication lock.
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.event.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    with:
      force_failure: ${{ inputs.verify_only == true && inputs.fail_validation == true }}

  gate:
    name: Validate API, PostgreSQL and mobile
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success

  publish:
    needs: [validate, gate]
    if: >-
      always() && !cancelled() &&
      needs.gate.result == 'success' && needs.validate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      verify_only: ${{ inputs.verify_only == true }}
      validated: ${{ needs.gate.result == 'success' && needs.validate.result == 'success' }}
