name: Publish API

on:
  workflow_call:
    inputs:
      verify_only:
        type: boolean
        default: false
      validated:
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.verify_only && format('verification-{0}', github.run_id) || 'production' }}
  cancel-in-progress: false

jobs:
  changes:
    if: inputs.validated
    name: Detect unpublished API changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      api: ${{ steps.release.outputs.api || steps.manual.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.verify_only)
        with:
          fetch-depth: 0
      - name: Require the current main revision for publication
        if: github.event_name != 'pull_request' && !inputs.verify_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$GITHUB_SHA" = "$current"
      - name: Detect unpublished API changes
        if: github.event_name == 'push'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs
      - name: Select API validation for manual workflow checks
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "api=true" >> "$GITHUB_OUTPUT"

  migrate:
    name: Run API migrations
    needs: [changes]
    if: >-
      inputs.validated && needs.changes.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && !inputs.verify_only && needs.changes.outputs.api == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.api == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    outputs:
      # The image name contains a registry username secret. GitHub drops a job output that includes a secret, so pass only the digest.
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.SPENDEAZYAPI2_REGISTRY_USERNAME }}
          password: ${{ secrets.SPENDEAZYAPI2_REGISTRY_PASSWORD }}
      - name: Build and publish API image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: syoro/spendeazy-api:${{ github.sha }}
          cache-from: type=gha,scope=spendeazy-api
          cache-to: type=gha,mode=max,scope=spendeazy-api
      - name: Azure login
        id: azure_login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.SPENDEAZYAPI2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SPENDEAZYAPI2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SPENDEAZYAPI2_AZURE_SUBSCRIPTION_ID }}
      - name: Run migrations with the published image
        env:
          AZURE_RESOURCE_GROUP: spendeazy-dev
          CONTAINERAPPS_ENVIRONMENT: managedEnvironment-spendeazydev-a6e6
          MIGRATION_JOB_NAME: spendeazy-mig-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_IMAGE: syoro/spendeazy-api@${{ steps.image.outputs.digest }}
          DATABASE_URL: ${{ secrets.SPENDEAZYAPI2_DATABASE_URL }}
          REGISTRY_USERNAME: ${{ secrets.SPENDEAZYAPI2_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SPENDEAZYAPI2_REGISTRY_PASSWORD }}
        run: node scripts/run-api-migration-job.mjs
      - name: Remove migration job if the runner was interrupted
        if: always() && steps.azure_login.outcome == 'success'
        env:
          AZURE_RESOURCE_GROUP: spendeazy-dev
          MIGRATION_JOB_NAME: spendeazy-mig-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if az containerapp job show --name "$MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors --output none; then
            az containerapp job delete --name "$MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --yes --output none
          fi

  api:
    name: Build and deploy API
    timeout-minutes: 15
    needs: [changes, migrate]
    if: >-
      always() && !cancelled() && inputs.validated && needs.changes.result == 'success' &&
      (needs.migrate.result == 'success' || (inputs.verify_only && needs.migrate.result == 'skipped')) &&
      ((github.event_name == 'workflow_dispatch' && needs.changes.outputs.api == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.api == 'true'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login
        if: ${{ !inputs.verify_only }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.SPENDEAZYAPI2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SPENDEAZYAPI2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SPENDEAZYAPI2_AZURE_SUBSCRIPTION_ID }}
      - name: Deploy migration-tested container image
        if: ${{ !inputs.verify_only }}
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          containerAppName: spendeazy-api
          resourceGroup: spendeazy-dev
          imageToDeploy: syoro/spendeazy-api@${{ needs.migrate.outputs.digest }}
      - name: Verify API publication gate
        if: inputs.verify_only
        run: echo "API publication permitted for $GITHUB_SHA; Azure upload disabled."
