  /api/v1/users/me/spaces/{spaceId}/statement-imports:
    get:
      description: Returns committed Statement Imports in the authorized Space in statementDate descending, then Statement Import ID descending order. Exact-file and probable-duplicate state is scoped to this destination Space.
      operationId: SpaceStatementImports_listStatementImports
      parameters:
        - name: spaceId
          required: true
          in: path
          description: Positive bigint Space identifier encoded as a string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '7'
        - name: fromDate
          required: false
          in: query
          description: Inclusive lower Statement import date. It must be a valid calendar date in YYYY-MM-DD format and be on or before toDate when both filters are supplied.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-01'
            type: string
        - name: toDate
          required: false
          in: query
          description: Inclusive upper Statement import date. It must be a valid calendar date in YYYY-MM-DD format.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-31'
            type: string
        - name: pageSize
          required: false
          in: query
          description: Number of Statement imports to return per page. Must be between 1 and 100 inclusive; defaults to 20. The cursor is not coupled to page size.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque base64url cursor for the next page. Reuse it only with the same date filters; cursors encode the fixed statementDate-descending, ID-descending ordering.
          schema:
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            example: eyJ2ZXJzaW9uIjoxLCJvcmRlcmluZyI6InN0YXRlbWVudERhdGU6ZGVzYy...
            type: string
      responses:
        '200':
          description: Statement-import history page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportHistoryPageResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: List Statement Import history in an authorized Space.
      tags:
        - Statement imports
    post:
      description: Revalidates reviewed Categories and duplicate state for the destination Space, then commits the Statement Import and all selected Transactions atomically. The importing User is retained as the Statement Import and Transaction contributor.
      operationId: SpaceStatementImports_commitReviewedStatementImport
      parameters:
        - name: spaceId
          required: true
          in: path
          description: Positive bigint Space identifier encoded as a string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitReviewedStatementImportDto'
      responses:
        '201':
          description: Statement import committed.
          headers:
            Location:
              required: true
              description: Relative canonical URI of the created Statement Import.
              schema:
                type: string
                example: /api/v1/users/me/spaces/7/statement-imports/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ProbableDuplicateConflict'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Commit a reviewed Statement Import into an authorized Space.
      tags:
        - Statement imports
info:
  title: Expense Tracker REST API
  description: A user-scoped expense tracker API. Bigint identifiers and counts, decimal money, domain dates, and UTC timestamps use the encodings described by the schemas below.
  version: 1.0.0
  contact: {}
tags:
  - name: Health
    description: Operational readiness.
  - name: Users
    description: Expense-data owners.
  - name: Spaces
    description: Authorized Personal and Shared financial contexts.
  - name: Invitations
    description: Shared Space invitation lifecycle and delivery.
  - name: Categories
    description: Active and historical categories.
  - name: Budgets
    description: Recurring category budgets.
  - name: Category rules
    description: Exact-description rules.
  - name: Transactions
    description: Manual and imported expenses.
  - name: Statement imports
    description: Reviewed import commits and history.
  - name: Category summaries
    description: Calendar-period spending summaries.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Whether the application is ready to serve requests.
          enum:
            - ok
            - error
          example: ok
        database:
          type: string
          description: Readiness state of the database dependency.
          enum:
            - ready
            - unavailable
          example: ready
      additionalProperties: false
      required:
        - status
        - database
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint User identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        name:
          type: string
          description: Display name synchronized from the identity provider.
          minLength: 1
          maxLength: 200
          pattern: \S
          example: Ada Lovelace
        email:
          type: string
          description: Primary verified email synchronized from the identity provider.
          format: email
          maxLength: 320
          example: ada@example.com
        createdAt:
          type: string
          description: UTC timestamp when the local User was created.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        updatedAt:
          type: string
          description: UTC timestamp when the local User was last updated.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      additionalProperties: false
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - INVALID_JSON
        - NOT_ACCEPTABLE
        - UNSUPPORTED_MEDIA_TYPE
        - ROUTE_NOT_FOUND
        - HTTP_ERROR
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - UNAUTHENTICATED
        - USER_NOT_PROVISIONED
        - CONFLICT
        - STALE_EDIT
        - RESOURCE_NOT_FOUND
        - USER_NOT_FOUND
        - SPACE_NOT_FOUND
        - SPACE_NOT_WRITABLE
        - INVITATION_NOT_FOUND
        - INVITATION_ALREADY_PENDING
        - INVITATION_RATE_LIMITED
        - INVITATION_DAILY_LIMIT_REACHED
        - INVITATION_SELF
        - INVITATION_INELIGIBLE
        - INVITATION_EXPIRED
        - INVITATION_CANCELED
        - INVITATION_DECLINED
        - EMAIL_ALREADY_EXISTS
        - CATEGORY_NOT_FOUND
        - CATEGORY_NAME_ALREADY_EXISTS
        - CATEGORY_INACTIVE
        - BUDGET_NOT_FOUND
        - CATEGORY_RULE_NOT_FOUND
        - CATEGORY_RULE_PATTERN_ALREADY_EXISTS
        - TRANSACTION_NOT_FOUND
        - STATEMENT_IMPORT_NOT_FOUND
        - IMPORTED_TRANSACTION_IMMUTABLE
        - STATEMENT_IMPORT_FILE_ALREADY_EXISTS
        - STATEMENT_IMPORT_FILE_HASH_INVALID
        - STATEMENT_IMPORT_PROBABLE_DUPLICATES
      description: Stable error code. Human-readable messages are not a compatibility contract.
    ErrorResponseDto:
      type: object
      properties:
        code:
          description: Stable error code. Human-readable messages are not a compatibility contract.
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Structured details for fields or domain-specific conflicts.
          items:
            oneOf:
              - $ref: '#/components/schemas/ErrorDetailDto'
              - $ref: '#/components/schemas/ProbableDuplicateDetailDto'
      additionalProperties: false
      required:
        - code
        - message
        - details
    ErrorEnvelopeDto:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseDto'
      additionalProperties: false
      required:
        - error
    ErrorDetailCode:
      type: string
      enum:
        - required
        - invalid_format
        - invalid_type
        - invalid_value
        - unknown
        - incompatible
        - not_allowed
        - not_unique
        - too_short
        - too_long
        - probable_duplicate
      description: Stable machine-readable field-detail code.
    ErrorDetailDto:
      type: object
      properties:
        categoryId:
          type: string
          description: Conflicting owned Category identifier for a category-rule duplicate.
          pattern: ^[1-9]\d*$
          example: '42'
        field:
          type: string
          description: JSON Pointer into the request.
          example: /email
        code:
          description: Stable machine-readable field-detail code.
          allOf:
            - $ref: '#/components/schemas/ErrorDetailCode'
        message:
          type: string
          description: Human-readable detail message.
      additionalProperties: false
      required:
        - field
        - code
        - message
    ProbableDuplicateDetailDto:
      type: object
      properties:
        field:
          type: string
          example: /transactions/0
        code:
          type: string
          enum:
            - probable_duplicate
        message:
          type: string
        transactionIndexes:
          type: array
          items:
            type: integer
            minimum: 0
        committedTransactionIds:
          type: array
          description: Public transaction IDs encoded as strings.
          items:
            type: string
            pattern: ^[1-9]\d*$
      additionalProperties: false
      required:
        - field
        - code
        - message
        - transactionIndexes
        - committedTransactionIds
    CategoryResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Category identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        name:
          type: string
          description: Trimmed Category display name. Uniqueness is checked case-insensitively.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Dining Out
        description:
          type: string
          description: Trimmed Category description, or null when no description is set.
          nullable: true
          maxLength: 500
          example: Restaurants and cafes
        color:
          type: string
          enum:
            - coral
            - scarlet
            - crimson
            - rose
            - magenta
            - orchid
            - plum
            - violet
            - indigo
            - cobalt
            - azure
            - sky
            - cyan
            - teal
            - emerald
            - forest
            - lime
            - olive
            - gold
            - amber
            - copper
            - cocoa
            - slate
            - steel
          description: Effective Category Color palette identifier. An explicitly saved choice is returned as-is; Categories without a saved choice receive a stable identity-based default.
          example: teal
        isActive:
          type: boolean
          description: Whether the Category is active. Inactive Categories retain their historical relationships and cannot receive a new Budget, although an existing Budget may still be replaced.
          example: true
        createdAt:
          type: string
          description: UTC timestamp when the Category was created.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        updatedAt:
          type: string
          description: UTC timestamp when the Category was last updated.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      description: A Category owned by the authenticated User. Inactive Categories retain their historical relationships.
      additionalProperties: false
      required:
        - id
        - name
        - description
        - color
        - isActive
        - createdAt
        - updatedAt
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Category display name. It is trimmed before storage and uniqueness checking; uniqueness is case-insensitive.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Dining Out
        description:
          type: string
          description: Optional Category description. Leading and trailing whitespace is removed; blank text is stored as null.
          nullable: true
          maxLength: 500
          example: Restaurants and cafes
        color:
          type: string
          enum:
            - coral
            - scarlet
            - crimson
            - rose
            - magenta
            - orchid
            - plum
            - violet
            - indigo
            - cobalt
            - azure
            - sky
            - cyan
            - teal
            - emerald
            - forest
            - lime
            - olive
            - gold
            - amber
            - copper
            - cocoa
            - slate
            - steel
          description: Optional palette identifier for the Category Color. When omitted, the API resolves a stable default from the Category identity.
          example: teal
      additionalProperties: false
      required:
        - name
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Category display name. It is trimmed before storage and uniqueness checking; uniqueness is case-insensitive.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Dining Out
        description:
          type: string
          description: Optional Category description. Leading and trailing whitespace is removed; null or blank text clears it.
          nullable: true
          maxLength: 500
          example: Restaurants and cafes
        isActive:
          type: boolean
          description: Whether the Category is active. Inactive Categories retain their historical relationships and cannot receive a new Budget, although an existing Budget may still be replaced.
          example: false
        color:
          type: string
          enum:
            - coral
            - scarlet
            - crimson
            - rose
            - magenta
            - orchid
            - plum
            - violet
            - indigo
            - cobalt
            - azure
            - sky
            - cyan
            - teal
            - emerald
            - forest
            - lime
            - olive
            - gold
            - amber
            - copper
            - cocoa
            - slate
            - steel
          description: Palette identifier for the Category Color. Saved colors remain unchanged when this field is omitted.
          example: teal
        updatedAt:
          type: string
          description: The UTC timestamp returned by the last read. Stale edits are rejected when another save changed the Category first.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      additionalProperties: false
      minProperties: 1
    BudgetResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Budget identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '100'
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        amount:
          type: string
          description: Positive exact two-decimal Budget amount encoded as a string, with up to 13 integer digits.
          pattern: ^(?=.*[1-9])\d{1,13}\.\d{2}$
          example: '250.00'
        period:
          type: string
          description: Recurring Budget period.
          enum:
            - monthly
            - yearly
          example: monthly
        createdAt:
          type: string
          description: UTC timestamp when the Budget was created.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        updatedAt:
          type: string
          description: UTC timestamp when the Budget was last updated.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      description: A recurring Budget owned through its Category and the authenticated User.
      additionalProperties: false
      required:
        - id
        - categoryId
        - amount
        - period
        - createdAt
        - updatedAt
    UpsertBudgetDto:
      type: object
      properties:
        amount:
          type: string
          description: Positive exact two-decimal Budget amount encoded as a string, with up to 13 integer digits.
          pattern: ^(?=.*[1-9])\d{1,13}\.\d{2}$
          example: '250.00'
        period:
          type: string
          description: Recurring Budget period.
          enum:
            - monthly
            - yearly
          example: monthly
        updatedAt:
          type: string
          description: The UTC timestamp returned by the last read. Stale edits are rejected when another save changed the Budget first.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      additionalProperties: false
      required:
        - amount
        - period
    CategorySummaryResponseDto:
      type: object
      properties:
        period:
          type: string
          description: Requested calendar period.
          enum:
            - monthly
            - yearly
          example: monthly
        year:
          type: string
          description: Four-digit calendar year used for the summary.
          pattern: ^\d{4}$
          example: '2026'
        month:
          type: string
          description: Two-digit calendar month for a monthly summary, or null for a yearly summary.
          pattern: ^(0[1-9]|1[0-2])$
          nullable: true
          example: '08'
        categories:
          type: array
          description: Categories ordered by ascending Category ID. Active Categories are included even with no spending; inactive Categories are included only when they have spending in the requested period.
          items:
            $ref: '#/components/schemas/CategorySummaryItemResponseDto'
        uncategorizedTotal:
          type: string
          description: Non-negative exact two-decimal spending total for Uncategorized Transactions, encoded as a string and zero when none exist. Aggregate totals are not limited by per-Transaction numeric precision.
          pattern: ^\d+\.\d{2}$
          example: '4.50'
        uncategorizedCount:
          type: string
          description: Non-negative count of Uncategorized Transactions encoded as a string.
          pattern: ^\d+$
          example: '1'
      description: A complete monthly or yearly Category spending summary owned by the authenticated User.
      additionalProperties: false
      required:
        - period
        - year
        - month
        - categories
        - uncategorizedTotal
        - uncategorizedCount
    CategorySummaryItemResponseDto:
      type: object
      properties:
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        name:
          type: string
          description: Trimmed Category display name.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Groceries
        isActive:
          type: boolean
          description: Whether the Category is active.
          example: true
        totalAmount:
          type: string
          description: Non-negative exact two-decimal aggregate spending amount encoded as a string. Aggregate totals are not limited by per-Transaction numeric precision.
          pattern: ^\d+\.\d{2}$
          example: '1250.00'
        transactionCount:
          type: string
          description: Non-negative Transaction count encoded as a string.
          pattern: ^\d+$
          example: '12'
        budgetAmount:
          type: string
          description: Matching-period Budget amount encoded as a positive exact two-decimal string, or null when the Category has no Budget for the requested period.
          pattern: ^(?=.*[1-9])\d{1,13}\.\d{2}$
          nullable: true
          example: '1500.00'
        remainingAmount:
          type: string
          description: Budget amount minus aggregate spending, encoded as an exact two-decimal string; it may be negative when spending exceeds the matching-period Budget, and is null when budgetAmount is null.
          pattern: ^-?\d+\.\d{2}$
          nullable: true
          example: '-25.50'
      description: A Category aggregate for the requested calendar period. Inactive Categories are included only when they have spending in that period.
      additionalProperties: false
      required:
        - categoryId
        - name
        - isActive
        - totalAmount
        - transactionCount
        - budgetAmount
        - remainingAmount
    SpaceMemberResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint User identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        name:
          type: string
          description: Display name of a User in the Space.
          minLength: 1
          example: Ada Lovelace
      additionalProperties: false
      required:
        - id
        - name
    SpaceResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Space identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        kind:
          type: string
          description: The kind of financial Space.
          enum:
            - personal
            - shared
          example: personal
        status:
          type: string
          description: The lifecycle state of the Space.
          enum:
            - active
            - archived
          example: active
        accessLevel:
          type: string
          description: The authenticated User's membership access. Read access includes archived history; write access is required for mutations.
          enum:
            - read
            - write
          example: write
        members:
          description: Users whose membership identity may be displayed for this authorized Space.
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/SpaceMemberResponseDto'
        createdAt:
          type: string
          description: UTC timestamp when the Space was created.
          format: date-time
          example: '2026-09-20T00:00:00.000Z'
        updatedAt:
          type: string
          description: UTC timestamp when the Space was last updated.
          format: date-time
          example: '2026-09-20T00:00:00.000Z'
      additionalProperties: false
      required:
        - id
        - kind
        - status
        - accessLevel
        - members
        - createdAt
        - updatedAt
    SpaceParamsDto:
      type: object
      properties:
        spaceId:
          type: string
          description: Positive bigint Space identifier encoded as a decimal string.
          pattern: ^[1-9]\d*$
          example: '42'
      required:
        - spaceId
    InvitationResponseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9]\d*$
          example: '42'
        recipientEmail:
          type: string
          format: email
          example: partner@example.com
        status:
          type: string
          enum:
            - pending
            - canceled
            - declined
            - expired
        expiresAt:
          type: string
          format: date-time
        lastSentAt:
          type: string
          format: date-time
          nullable: true
        deliveryStatus:
          type: string
          enum:
            - pending
            - sent
            - failed
        deliveryError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        senderName:
          type: string
          description: Display name of the inviter.
      required:
        - id
        - recipientEmail
        - status
        - expiresAt
        - deliveryStatus
        - createdAt
        - updatedAt
    InvitationInboxResponseDto:
      type: object
      properties:
        outgoing:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/InvitationResponseDto'
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/InvitationResponseDto'
      required:
        - outgoing
        - incoming
    CreateInvitationDto:
      type: object
      properties:
        email:
          type: string
          description: Email address that should receive the invitation.
          format: email
          maxLength: 320
          example: partner@example.com
      required:
        - email
    ConfirmInvitationDeclineDto:
      type: object
      properties:
        confirm:
          type: boolean
          description: The user explicitly confirmed that the invitation is declined.
          example: true
      required:
        - confirm
    PublicInvitationResponseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9]\d*$
          example: '42'
        senderName:
          type: string
          description: Display name of the inviter.
        recipientEmail:
          type: string
          format: email
          example: partner@example.com
        status:
          type: string
          enum:
            - pending
        expiresAt:
          type: string
          format: date-time
        canDecline:
          type: boolean
          example: true
      required:
        - id
        - senderName
        - recipientEmail
        - status
        - expiresAt
        - canDecline
    CategoryRuleResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Category rule identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        pattern:
          type: string
          description: Original rule text containing at least one non-whitespace character. Matching trims surrounding whitespace, collapses repeated whitespace, and compares case-insensitively.
          minLength: 1
          maxLength: 500
          pattern: \S
          example: Green   Market
        matchType:
          type: string
          description: Exact or Contains matching. The normalized pattern is not returned.
          enum:
            - exact
            - contains
          example: exact
        createdAt:
          type: string
          description: UTC timestamp when the Category rule was created.
          format: date-time
