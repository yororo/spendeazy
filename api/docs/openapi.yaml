openapi: 3.0.3
paths:
  /health:
    get:
      operationId: Health_getHealth
      parameters: []
      responses:
        '200':
          description: Database is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
      security: []
      summary: Check database readiness.
      tags:
        - Health
  /api/v1/users/me:
    put:
      operationId: Users_provisionUser
      parameters: []
      responses:
        '200':
          description: User synchronized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '201':
          description: User provisioned.
          headers:
            Location:
              required: true
              description: Relative canonical URI of the created User.
              schema:
                type: string
                example: /api/v1/users/me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
      summary: Provision or synchronize my User profile. The request body is ignored.
      tags:
        - Users
    get:
      operationId: Users_getUser
      parameters: []
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Get my User profile.
      tags:
        - Users
    delete:
      description: The local User is retained as a Deleted user tombstone so immutable financial attribution remains readable. Active Shared Spaces become permanent read-only history for the remaining member.
      operationId: Users_deleteUser
      parameters: []
      responses:
        '204':
          description: Identity access removed.
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Delete the local identity and archive any active Shared Space history.
      tags:
        - Users
  /api/v1/users/me/categories:
    post:
      description: Category names are trimmed before storage and uniqueness checking; uniqueness is case-insensitive.
      operationId: Categories_createCategory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryDto'
      responses:
        '201':
          description: Category created.
          headers:
            Location:
              required: true
              description: Relative canonical URI of the created Category.
              schema:
                type: string
                example: /api/v1/users/me/categories/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Create a category.
      tags:
        - Categories
    get:
      operationId: Categories_listCategories
      parameters: []
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponseDto'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: List all owned categories in ascending ID order.
      tags:
        - Categories
  /api/v1/users/me/categories/{categoryId}:
    get:
      operationId: Categories_getCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      responses:
        '200':
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Get a category.
      tags:
        - Categories
    patch:
      description: Inactive Categories retain their historical relationships and cannot receive a new Budget, although an existing Budget may still be replaced.
      operationId: Categories_updateCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryDto'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Edit or activate/deactivate a category.
      tags:
        - Categories
  /api/v1/users/me/categories/{categoryId}/budget:
    put:
      description: A new Budget returns 201 with Location; replacing an existing Budget returns 200. An inactive Category cannot receive a new Budget, although an existing Budget may still be replaced.
      operationId: Budgets_putBudget
