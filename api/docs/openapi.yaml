        - categoryId
        - purchaseDate
        - description
        - amount
        - source
        - statementImportId
        - createdAt
        - updatedAt
    TransactionHistoryPageResponseDto:
      type: object
      properties:
        totalCount:
          type: string
          description: Total number of Transactions matching the filters across all pages.
          pattern: ^\d+$
          example: '43'
        items:
          type: array
          description: Transactions ordered by purchaseDate descending, then Transaction ID descending. The source discriminator selects manual or imported history relationships.
          items:
            oneOf:
              - $ref: '#/components/schemas/ManualTransactionHistoryResponseDto'
              - $ref: '#/components/schemas/ImportedTransactionHistoryResponseDto'
            discriminator:
              propertyName: source
              mapping:
                manual: '#/components/schemas/ManualTransactionHistoryResponseDto'
                imported: '#/components/schemas/ImportedTransactionHistoryResponseDto'
        nextCursor:
          type: string
          description: Opaque base64url cursor for the next page, or null when there are no more results. A cursor must be reused with the same filters; page size is not part of the cursor.
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          nullable: true
          example: null
      description: A keyset-paginated Transaction history page. Results are ordered by purchaseDate descending, then Transaction ID descending. Active pages omit deleted Transactions; retained-history pages contain only deleted Transactions.
      additionalProperties: false
      required:
        - totalCount
        - items
        - nextCursor
    TransactionActivitySnapshotDto:
      type: object
      properties:
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a string, or null when the Transaction was Uncategorized.
          pattern: ^[1-9]\d*$
          nullable: true
          example: '42'
        purchaseDate:
          type: string
          description: Valid calendar purchase date encoded as YYYY-MM-DD.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-01'
        description:
          type: string
          description: Trimmed Transaction description at the time of the event.
          minLength: 1
          maxLength: 500
          pattern: \S
          example: Coffee
        amount:
          type: string
          description: Positive exact two-decimal Transaction amount encoded as a string.
          pattern: ^(?=.*[1-9])\d{1,13}\.\d{2}$
          example: '4.50'
      description: The editable Transaction values captured before or after an edit.
      additionalProperties: false
      required:
        - categoryId
        - purchaseDate
        - description
        - amount
    TransactionActivityResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint activity identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '200'
        transactionId:
          type: string
          description: Positive bigint Transaction identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '100'
        type:
          type: string
          description: The activity event type.
          enum:
            - created
            - edited
            - deleted
          example: created
        actorUserId:
          type: string
          description: Positive bigint identifier of the User who caused the event.
          pattern: ^[1-9]\d*$
          example: '7'
        occurredAt:
          type: string
          description: UTC timestamp when the activity event occurred.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        before:
          description: Transaction values before an edit. Present only for edited events.
          allOf:
            - $ref: '#/components/schemas/TransactionActivitySnapshotDto'
        after:
          description: Transaction values after an edit. Present only for edited events.
          allOf:
            - $ref: '#/components/schemas/TransactionActivitySnapshotDto'
      description: A recorded activity event for a Transaction. Legacy Transactions may have no activity records.
      additionalProperties: false
      required:
        - id
        - transactionId
        - type
        - actorUserId
        - occurredAt
    UpdateSpaceTransactionDto:
      type: object
      properties:
        purchaseDate:
          type: string
          description: Valid calendar purchase date in YYYY-MM-DD format.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-01'
        description:
          type: string
          description: Transaction description, trimmed before storage.
          minLength: 1
          maxLength: 500
          pattern: \S
          example: Coffee
        amount:
          type: string
          description: Positive exact two-decimal Transaction amount encoded as a string, with up to 13 integer digits.
          pattern: ^(?=.*[1-9])\d{1,13}\.\d{2}$
          example: '4.50'
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a string. Omit or set to null to leave the Transaction Uncategorized.
          pattern: ^[1-9]\d*$
          nullable: true
          example: '42'
        updatedAt:
          type: string
          description: The UTC timestamp returned by the last read. A Space edit must include it so stale changes are rejected.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      additionalProperties: false
      minProperties: 2
      required:
        - updatedAt
    CommitReviewedStatementImportDto:
      type: object
      properties:
        fileName:
          type: string
          description: Statement file name, trimmed before storage.
          minLength: 1
          maxLength: 255
          pattern: \S
          example: august.pdf
        fileHash:
          type: string
          description: Lowercase SHA-256 digest asserted by the client. It is used for exact-file duplicate detection and is never returned.
          pattern: ^[0-9a-f]{64}$
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        statementDate:
          type: string
          description: Valid calendar statement date encoded as YYYY-MM-DD.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-31'
        bank:
          type: string
          description: Statement bank name, trimmed before storage.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Example Bank
        cardType:
          type: string
          description: Optional card type, trimmed before storage when supplied.
          minLength: 1
          maxLength: 100
          pattern: \S
          nullable: true
          example: visa
        transactions:
          type: array
          description: Reviewed Transactions to commit. The array may be empty; each row is normalized and validated before it is stored.
          items:
            $ref: '#/components/schemas/ReviewedStatementTransactionDto'
        acknowledgeProbableDuplicates:
          type: boolean
          description: Acknowledge all probable-duplicate review signals. Defaults to false; exact file duplicates cannot be acknowledged.
          default: false
          example: false
      additionalProperties: false
      required:
        - fileName
        - fileHash
        - statementDate
        - bank
        - transactions
    ReviewedStatementTransactionDto:
      type: object
      properties:
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a string. Omit or set to null to leave the imported Transaction Uncategorized.
          pattern: ^[1-9]\d*$
          nullable: true
          example: '42'
        purchaseDate:
          type: string
          description: Valid calendar purchase date encoded as YYYY-MM-DD.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-01'
        description:
          type: string
          description: Transaction description, trimmed before storage.
          minLength: 1
          maxLength: 500
          pattern: \S
          example: Coffee
        amount:
          type: string
          description: Positive exact two-decimal Transaction amount encoded as a string, normalized to remove redundant leading zeroes before storage.
          pattern: ^(?=.*[1-9])\d{1,13}\.\d{2}$
          example: '4.50'
        categoryMatchConfidence:
          type: string
          description: Optional category-match confidence encoded as a decimal string between 0 and 1 inclusive, with up to four fractional digits.
          pattern: ^(?:0(?:\.\d{1,4})?|1(?:\.0{1,4})?)$
          nullable: true
          example: '0.9000'
      additionalProperties: false
      required:
        - purchaseDate
        - description
        - amount
    StatementImportCollectionQueryDto:
      type: object
      properties:
        fromDate:
          type: string
          description: Inclusive lower Statement import date. It must be a valid calendar date in YYYY-MM-DD format and be on or before toDate when both filters are supplied.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-01'
        toDate:
          type: string
          description: Inclusive upper Statement import date. It must be a valid calendar date in YYYY-MM-DD format.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-31'
        pageSize:
          type: integer
          description: Number of Statement imports to return per page. Must be between 1 and 100 inclusive; defaults to 20. The cursor is not coupled to page size.
          minimum: 1
          maximum: 100
          default: 20
          example: 20
        cursor:
          type: string
          description: Opaque base64url cursor for the next page. Reuse it only with the same date filters; cursors encode the fixed statementDate-descending, ID-descending ordering.
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          example: eyJ2ZXJzaW9uIjoxLCJvcmRlcmluZyI6InN0YXRlbWVudERhdGU6ZGVzYy...
      additionalProperties: false
    StatementImportParamsDto:
      type: object
      properties:
        statementImportId:
          type: string
          description: Positive bigint Statement import identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
      required:
        - statementImportId
    StatementImportResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Statement import identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '100'
        fileName:
          type: string
          description: Statement file name retained after trimming.
          minLength: 1
          maxLength: 255
          pattern: \S
          example: august.pdf
        statementDate:
          type: string
          description: Valid calendar statement date encoded as YYYY-MM-DD.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-31'
        bank:
          type: string
          description: Statement bank name retained after trimming.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Example Bank
        cardType:
          type: string
          description: Card type retained after trimming, or null when the statement did not provide one.
          minLength: 1
          maxLength: 100
          pattern: \S
          nullable: true
          example: visa
        importedAt:
          type: string
          description: UTC timestamp when the Statement import was committed.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        importedByUserId:
          type: string
          description: Positive bigint User identifier for the contributor who imported the Statement, encoded as a string.
          pattern: ^[1-9]\d*$
          example: '7'
      description: A committed Statement import in the destination Space, attributed to the importing User. Client file hashes and persistence fields are not returned.
      additionalProperties: false
      required:
        - id
        - fileName
        - statementDate
        - bank
        - cardType
        - importedAt
        - importedByUserId
    StatementImportHistoryResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Statement import identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '100'
        fileName:
          type: string
          description: Statement file name retained after trimming.
          minLength: 1
          maxLength: 255
          pattern: \S
          example: august.pdf
        statementDate:
          type: string
          description: Valid calendar statement date encoded as YYYY-MM-DD.
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-31'
        bank:
          type: string
          description: Statement bank name retained after trimming.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Example Bank
        cardType:
          type: string
          description: Card type retained after trimming, or null when the statement did not provide one.
          minLength: 1
          maxLength: 100
          pattern: \S
          nullable: true
          example: visa
        importedAt:
          type: string
          description: UTC timestamp when the Statement import was committed.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        importedByUserId:
          type: string
          description: Positive bigint User identifier for the contributor who imported the Statement, encoded as a string.
          pattern: ^[1-9]\d*$
          example: '7'
        transactionCount:
          type: string
          description: Non-negative committed Transaction count encoded as a string.
          pattern: ^\d+$
          example: '12'
      description: A Statement import in the destination Space history collection, including its committed Transaction count.
      additionalProperties: false
      required:
        - id
        - fileName
        - statementDate
        - bank
        - cardType
        - importedAt
        - importedByUserId
        - transactionCount
    StatementImportHistoryPageResponseDto:
      type: object
      properties:
        items:
          type: array
          description: Statement imports ordered by statementDate descending, then Statement import ID descending.
          items:
            $ref: '#/components/schemas/StatementImportHistoryResponseDto'
        nextCursor:
          type: string
          description: Opaque base64url cursor for the next page, or null when there are no more results. A cursor must be reused with the same date filters; page size is not part of the cursor.
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          nullable: true
          example: null
      description: A keyset-paginated Statement import history page. Items are ordered by statementDate descending, then Statement import ID descending.
      additionalProperties: false
      required:
        - items
        - nextCursor
    SpaceStatementImportParamsDto:
      type: object
      properties:
        spaceId:
          type: string
          description: Positive bigint Space identifier encoded as a decimal string.
          pattern: ^[1-9]\d*$
          example: '7'
        statementImportId:
          type: string
          description: Positive bigint Statement import identifier encoded as a decimal string.
          pattern: ^[1-9]\d*$
          example: '42'
      required:
        - spaceId
        - statementImportId
    OutgoingInvitationResponseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9]\d*$
          example: '42'
        code:
          type: string
          description: The sender-only Invite Code. It is grouped for human entry and is never placed in a URL.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}(?:-[0-9A-HJKMNP-TV-Z]{4}){5}$
          example: 7K3M-2Q8R-5T6V-W9X2-C4D7-H8J3
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - status
        - expiresAt
        - createdAt
        - updatedAt
    IncomingInvitationResponseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9]\d*$
          example: '42'
        senderName:
          type: string
          description: Display name of the inviter.
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - senderName
        - status
        - expiresAt
        - createdAt
    InvitationInboxResponseDto:
      type: object
      properties:
        outgoing:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/OutgoingInvitationResponseDto'
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/IncomingInvitationResponseDto'
      required:
        - outgoing
        - incoming
    CreateInvitationDto:
      type: object
      properties: {}
    ClaimInvitationDto:
      type: object
      properties:
        code:
          type: string
          description: The Invite Code entered by the authenticated User. Case and grouping separators are normalized by the API.
          example: 7K3M-2Q8R-5T6V-W9X2-C4D7-H8J3
          maxLength: 64
      required:
        - code
  responses:
    UnauthenticatedError:
      description: The request does not include valid Clerk session credentials.
      headers:
        WWW-Authenticate:
          required: true
          description: Authentication scheme accepted by the API.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: UNAUTHENTICATED
              message: Authentication required
              details: []
    UserNotProvisionedError:
      description: The verified Clerk identity is not linked to a local User. Provision the User first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: USER_NOT_PROVISIONED
              message: User is not provisioned
              details: []
    NotFoundError:
      description: The requested resource is absent or owned by another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            user:
              value:
                error:
                  code: USER_NOT_FOUND
                  message: User was not found
                  details: []
            route:
              value:
                error:
                  code: ROUTE_NOT_FOUND
                  message: Request failed
                  details: []
    NotAcceptableError:
      description: The client did not accept the representation required by the endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: NOT_ACCEPTABLE
              message: The endpoint requires an application/json response
              details: []
    InternalError:
      description: An unexpected server error. Infrastructure details are never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: INTERNAL_ERROR
              message: An internal error occurred
              details: []
    ValidationError:
      description: The request syntax or fields are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            invalidField:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: The request contains invalid fields.
                  details:
                    - field: /email
                      code: invalid_format
                      message: Email must be a valid email address
    ConflictError:
      description: The request conflicts with current application state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            emailAlreadyExists:
              value:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Email is already in use
                  details:
                    - field: /email
                      code: not_unique
                      message: Email is already in use
            genericConflict:
              value:
                error:
                  code: CONFLICT
                  message: Request conflicts with existing data
                  details: []
    ServiceUnavailableError:
      description: A required external service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: The identity provider is temporarily unavailable
              details: []
    HttpError:
      description: A generic HTTP protocol error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: HTTP_ERROR
              message: Request failed
              details: []
    UnsupportedMediaTypeError:
      description: A request body must use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Request bodies must use application/json
              details: []
    ProbableDuplicateConflict:
      description: Statement import conflicts are stable JSON errors. Exact file duplicates cannot be overridden; probable duplicates require explicit acknowledgement. Internal matching values are never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            fileAlreadyImported:
              summary: The same file was already imported for this User.
              value:
                error:
                  code: STATEMENT_IMPORT_FILE_ALREADY_EXISTS
                  message: The statement file has already been imported
                  details:
                    - field: /fileHash
                      code: not_unique
                      message: The statement file has already been imported
            withinSubmission:
              summary: Duplicate rows within the submitted statement only.
              value:
                error:
                  code: STATEMENT_IMPORT_PROBABLE_DUPLICATES
                  message: Probable duplicate imported transactions require acknowledgement
                  details:
                    - field: /transactions/0
                      code: probable_duplicate
                      message: The reviewed transaction has a probable duplicate
                      transactionIndexes:
                        - 0
                        - 2
                      committedTransactionIds: []
            committedMatch:
              summary: A submitted row matches previously committed imported Transactions.
              value:
                error:
                  code: STATEMENT_IMPORT_PROBABLE_DUPLICATES
                  message: Probable duplicate imported transactions require acknowledgement
                  details:
                    - field: /transactions/1
                      code: probable_duplicate
                      message: The reviewed transaction has a probable duplicate
                      transactionIndexes:
                        - 1
                      committedTransactionIds:
                        - '12'
                        - '18'
            categoryInactive:
              summary: A reviewed row references an inactive Category.
              value:
                error:
                  code: CATEGORY_INACTIVE
                  message: Category is inactive
                  details:
                    - field: /transactions/0/categoryId
                      code: category_inactive
                      message: The reviewed transaction uses an inactive Category
                      categoryId: '42'
                      transactionIndexes:
                        - 0
                        - 2
    RateLimitError:
      description: Too many Invite Code attempts were made for the authenticated User or network source.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: INVITATION_CODE_RATE_LIMITED
              message: Too many Invite Code attempts. Try again later.
              details: []
security:
  - bearerAuth: []
