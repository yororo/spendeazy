          example: null
      description: A keyset-paginated Statement import history page. Items are ordered by statementDate descending, then Statement import ID descending.
      additionalProperties: false
      required:
        - items
        - nextCursor
    SpaceStatementImportParamsDto:
      type: object
      properties:
        spaceId:
          type: string
          description: Positive bigint Space identifier encoded as a decimal string.
          pattern: ^[1-9]\d*$
          example: '7'
        statementImportId:
          type: string
          description: Positive bigint Statement import identifier encoded as a decimal string.
          pattern: ^[1-9]\d*$
          example: '42'
      required:
        - spaceId
        - statementImportId
  responses:
    UnauthenticatedError:
      description: The request does not include valid Clerk session credentials.
      headers:
        WWW-Authenticate:
          required: true
          description: Authentication scheme accepted by the API.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: UNAUTHENTICATED
              message: Authentication required
              details: []
    UserNotProvisionedError:
      description: The verified Clerk identity is not linked to a local User. Provision the User first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: USER_NOT_PROVISIONED
              message: User is not provisioned
              details: []
    NotFoundError:
      description: The requested resource is absent or owned by another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            user:
              value:
                error:
                  code: USER_NOT_FOUND
                  message: User was not found
                  details: []
            route:
              value:
                error:
                  code: ROUTE_NOT_FOUND
                  message: Request failed
                  details: []
    NotAcceptableError:
      description: The client did not accept the representation required by the endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: NOT_ACCEPTABLE
              message: The endpoint requires an application/json response
              details: []
    InternalError:
      description: An unexpected server error. Infrastructure details are never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: INTERNAL_ERROR
              message: An internal error occurred
              details: []
    ValidationError:
      description: The request syntax or fields are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            invalidField:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: The request contains invalid fields.
                  details:
                    - field: /email
                      code: invalid_format
                      message: Email must be a valid email address
    ConflictError:
      description: The request conflicts with current application state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            emailAlreadyExists:
              value:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Email is already in use
                  details:
                    - field: /email
                      code: not_unique
                      message: Email is already in use
            genericConflict:
              value:
                error:
                  code: CONFLICT
                  message: Request conflicts with existing data
                  details: []
    ServiceUnavailableError:
      description: A required external service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: The identity provider is temporarily unavailable
              details: []
    HttpError:
      description: A generic HTTP protocol error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: HTTP_ERROR
              message: Request failed
              details: []
    UnsupportedMediaTypeError:
      description: A request body must use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Request bodies must use application/json
              details: []
    ProbableDuplicateConflict:
      description: Statement import conflicts are stable JSON errors. Exact file duplicates cannot be overridden; probable duplicates require explicit acknowledgement. Internal matching values are never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeDto'
          examples:
            fileAlreadyImported:
              summary: The same file was already imported for this User.
              value:
                error:
                  code: STATEMENT_IMPORT_FILE_ALREADY_EXISTS
                  message: The statement file has already been imported
                  details:
                    - field: /fileHash
                      code: not_unique
                      message: The statement file has already been imported
            withinSubmission:
              summary: Duplicate rows within the submitted statement only.
              value:
                error:
                  code: STATEMENT_IMPORT_PROBABLE_DUPLICATES
                  message: Probable duplicate imported transactions require acknowledgement
                  details:
                    - field: /transactions/0
                      code: probable_duplicate
                      message: The reviewed transaction has a probable duplicate
                      transactionIndexes:
                        - 0
                        - 2
                      committedTransactionIds: []
            committedMatch:
              summary: A submitted row matches previously committed imported Transactions.
              value:
                error:
                  code: STATEMENT_IMPORT_PROBABLE_DUPLICATES
                  message: Probable duplicate imported transactions require acknowledgement
                  details:
                    - field: /transactions/1
                      code: probable_duplicate
                      message: The reviewed transaction has a probable duplicate
                      transactionIndexes:
                        - 1
                      committedTransactionIds:
                        - '12'
                        - '18'
            categoryInactive:
              summary: A reviewed row references an inactive Category.
              value:
                error:
                  code: CATEGORY_INACTIVE
                  message: Category is inactive
                  details: []
