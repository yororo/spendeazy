      tags:
        - Budgets
    delete:
      operationId: Budgets_deleteBudget
      parameters:
        - name: if-match
          required: false
          in: header
          description: Optional Budget updatedAt timestamp. The delete is rejected when it is stale.
          schema:
            type: string
        - name: categoryId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      responses:
        '204':
          description: Budget deleted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Delete a category budget.
