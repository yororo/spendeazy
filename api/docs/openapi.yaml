      tags:
        - Budgets
    delete:
      operationId: Budgets_deleteBudget
      parameters:
        - name: if-match
          required: true
          in: header
          description: Budget updatedAt timestamp from the last read. The delete is rejected when it is stale.
          schema:
            type: string
        - name: categoryId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      responses:
        '204':
          description: Budget deleted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Delete a category budget.
