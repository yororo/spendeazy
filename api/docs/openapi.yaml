        '500':
          $ref: '#/components/responses/InternalError'
      summary: Create a manual transaction.
      tags:
        - Transactions
    get:
      description: Returns manual and imported Transactions owned by the authenticated User in purchaseDate descending, then Transaction ID descending order. fromDate and toDate are inclusive valid calendar-date filters and fromDate must be on or before toDate. pageSize must be between 1 and 100 and defaults to 20. The nextCursor is opaque, binds to every filter except pageSize, and must be reused with the same filters. Unknown query parameters are rejected.
      operationId: Transactions_listTransactions
      parameters:
        - name: fromDate
          required: false
          in: query
          description: Inclusive lower purchase date. It must be a valid calendar date in YYYY-MM-DD format and be on or before toDate when both filters are supplied.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-01'
            type: string
        - name: toDate
          required: false
          in: query
          description: Inclusive upper purchase date. It must be a valid calendar date in YYYY-MM-DD format.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-31'
            type: string
        - name: categoryId
          required: false
          in: query
          description: Only Transactions assigned to this positive bigint Category identifier owned by the authenticated User.
          schema:
            pattern: ^[1-9]\d*$
            example: '42'
            type: string
        - name: categoryState
          required: false
          in: query
          description: Whether to return categorized Transactions or Uncategorized Transactions.
          schema:
            example: categorized
            type: string
            enum:
              - categorized
              - uncategorized
        - name: statementImportId
          required: false
          in: query
          description: Only Transactions committed from this positive bigint Statement import identifier owned by the authenticated User.
          schema:
            pattern: ^[1-9]\d*$
            example: '10'
            type: string
        - name: source
          required: false
          in: query
          description: Whether to return manually recorded or imported Transactions.
          schema:
            example: imported
            type: string
            enum:
              - manual
              - imported
        - name: description
          required: false
          in: query
          description: Case-insensitive text contained in the Transaction description.
          schema:
            minLength: 1
            maxLength: 500
            example: groceries
            type: string
        - name: accountBank
          required: false
          in: query
          description: Imported Account bank name. Pair with accountCardType; use source=manual for Cash.
          schema:
            example: BDO
            type: string
        - name: accountCardType
          required: false
          in: query
          description: Imported Account card or wallet type; empty for Accounts without one.
          schema:
            example: AMEX
            type: string
        - name: pageSize
          required: false
          in: query
          description: Number of Transactions to return per page. Must be between 1 and 100 inclusive; defaults to 20. The cursor is not coupled to page size.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque base64url cursor for the next page. Reuse it only with the same filters; cursors encode the fixed purchaseDate-descending, ID-descending ordering.
          schema:
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            example: eyJ2ZXJzaW9uIjoxLCJvcmRlcmluZyI6InB1cmNoYXNlRGF0ZTpkZXNjLG...
            type: string
      responses:
        '200':
          description: Transaction page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryPageResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
