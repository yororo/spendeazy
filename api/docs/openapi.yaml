      tags:
        - Budgets
    get:
      operationId: Budgets_getBudget
      parameters:
        - name: categoryId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      responses:
