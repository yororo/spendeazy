          description: Inclusive upper Statement import date. It must be a valid calendar date in YYYY-MM-DD format.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-31'
            type: string
        - name: pageSize
          required: false
          in: query
          description: Number of Statement imports to return per page. Must be between 1 and 100 inclusive; defaults to 20. The cursor is not coupled to page size.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque base64url cursor for the next page. Reuse it only with the same date filters; cursors encode the fixed statementDate-descending, ID-descending ordering.
          schema:
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            example: eyJ2ZXJzaW9uIjoxLCJvcmRlcmluZyI6InN0YXRlbWVudERhdGU6ZGVzYy...
            type: string
      responses:
        '200':
          description: Statement-import history page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportHistoryPageResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: List statement-import history in statement-date-descending, ID-descending keyset pages.
      tags:
        - Statement imports
    post:
      description: Commits the reviewed Statement import and its Transactions as one operation. File names, bank names, card types, and Transaction descriptions are trimmed before storage; amounts are normalized to canonical decimal strings. Exact-file duplicates cannot be acknowledged, while probable duplicate signals require explicit acknowledgement. Client file hashes and internal matching values are never returned.
      operationId: StatementImports_commitReviewedStatementImport
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitReviewedStatementImportDto'
      responses:
        '201':
          description: Statement import committed.
          headers:
            Location:
              required: true
              description: Relative canonical URI of the created Statement import.
              schema:
                type: string
                example: /api/v1/users/me/spaces/7/statement-imports/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ProbableDuplicateConflict'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Commit an already parsed and reviewed statement atomically.
      tags:
        - Statement imports
  /api/v1/users/me/spaces/{spaceId}/statement-imports/{statementImportId}:
    get:
      operationId: SpaceStatementImports_getStatementImport
      parameters:
        - name: spaceId
          required: true
          in: path
          description: Positive bigint Space identifier encoded as a string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '7'
        - name: statementImportId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      responses:
        '200':
          description: Statement import.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Get a Statement Import in an authorized Space.
      tags:
        - Statement imports
  /api/v1/users/me/spaces/{spaceId}/statement-imports:
    get:
      description: Returns committed Statement Imports in the authorized Space in statementDate descending, then Statement Import ID descending order. Exact-file and probable-duplicate state is scoped to this destination Space.
      operationId: SpaceStatementImports_listStatementImports
      parameters:
        - name: spaceId
          required: true
          in: path
          description: Positive bigint Space identifier encoded as a string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '7'
        - name: fromDate
          required: false
          in: query
          description: Inclusive lower Statement import date. It must be a valid calendar date in YYYY-MM-DD format and be on or before toDate when both filters are supplied.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-01'
            type: string
        - name: toDate
          required: false
          in: query
          description: Inclusive upper Statement import date. It must be a valid calendar date in YYYY-MM-DD format.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-08-31'
            type: string
        - name: pageSize
          required: false
          in: query
          description: Number of Statement imports to return per page. Must be between 1 and 100 inclusive; defaults to 20. The cursor is not coupled to page size.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque base64url cursor for the next page. Reuse it only with the same date filters; cursors encode the fixed statementDate-descending, ID-descending ordering.
          schema:
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            example: eyJ2ZXJzaW9uIjoxLCJvcmRlcmluZyI6InN0YXRlbWVudERhdGU6ZGVzYy...
            type: string
      responses:
        '200':
          description: Statement-import history page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportHistoryPageResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: List Statement Import history in an authorized Space.
      tags:
        - Statement imports
    post:
      description: Revalidates reviewed Categories and duplicate state for the destination Space, then commits the Statement Import and all selected Transactions atomically. The importing User is retained as the Statement Import and Transaction contributor.
      operationId: SpaceStatementImports_commitReviewedStatementImport
      parameters:
        - name: spaceId
          required: true
          in: path
          description: Positive bigint Space identifier encoded as a string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitReviewedStatementImportDto'
      responses:
        '201':
          description: Statement import committed.
          headers:
            Location:
              required: true
              description: Relative canonical URI of the created Statement Import.
              schema:
                type: string
                example: /api/v1/users/me/spaces/7/statement-imports/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ProbableDuplicateConflict'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Commit a reviewed Statement Import into an authorized Space.
      tags:
        - Statement imports
  /api/v1/users/me/invitations:
    get:
      description: Only the authenticated sender can receive their outgoing Invite Code. Incoming invitation claims are returned without exposing any sender code.
      operationId: Invitations_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInboxResponseDto'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Get the authenticated User's Shared Space invitations.
      tags:
        - Invitations
    post:
      description: Creates a sender-owned seven-day Invite Code without a recipient email. The authenticated sender may retrieve the same code from later list requests. The code is returned only in this sender-scoped response and is never included in a URL.
      operationId: Invitations_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingInvitationResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Create one Shared Space Invite Code.
      tags:
        - Invitations
    delete:
      description: Revokes the sender’s active Invite Code and removes every saved invitation claim made through it. Only the authenticated sender can perform this operation.
      operationId: Invitations_revoke
      parameters: []
      responses:
        '204':
          description: ''
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Revoke the authenticated sender’s Shared Space Invite Code.
      tags:
        - Invitations
  /api/v1/users/me/invitations/rotate:
    post:
      description: Replaces the sender’s active seven-day Invite Code, immediately invalidates the previous code, and removes every saved invitation claim made through it. Only the authenticated sender can perform this operation.
      operationId: Invitations_rotate
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingInvitationResponseDto'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Rotate the authenticated sender’s Shared Space Invite Code.
      tags:
        - Invitations
  /api/v1/users/me/invitations/claims:
    post:
      description: Validates the entered Invite Code for the authenticated User and saves a personal incoming invitation claim. This operation never creates membership. Unavailable codes use one generic response.
      operationId: Invitations_claim
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInvitationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingInvitationResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '413':
          $ref: '#/components/responses/HttpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Save a Shared Space invitation by Invite Code.
      tags:
        - Invitations
  /api/v1/users/me/invitations/claims/{claimId}:
    delete:
      description: Removes only the authenticated User’s saved invitation claim. The sender’s Invite Code and other Users’ claims remain available.
      operationId: Invitations_decline
      parameters:
        - name: claimId
          required: true
          in: path
          schema:
            pattern: ^[1-9]\d*$
            example: '88'
            type: string
      responses:
        '204':
          description: ''
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Decline a saved Shared Space invitation.
      tags:
        - Invitations
  /api/v1/users/me/invitations/claims/{claimId}/accept:
    post:
      description: The authenticated User explicitly accepts their saved invitation. The API rechecks both Users’ eligibility, creates one active Shared Space with equal write membership and default Categories, consumes the Invite Code, and invalidates competing invitations.
      operationId: Invitations_accept
      parameters:
        - name: claimId
          required: true
          in: path
          description: Saved invitation claim identifier.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '88'
      responses:
        '200':
          description: The newly joined Shared Space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
      summary: Join a Shared Space from a saved invitation.
      tags:
        - Invitations
info:
  title: Expense Tracker REST API
  description: A user-scoped expense tracker API. Bigint identifiers and counts, decimal money, domain dates, and UTC timestamps use the encodings described by the schemas below.
  version: 1.0.0
  contact: {}
tags:
  - name: Health
    description: Operational readiness.
  - name: Users
    description: Expense-data owners.
  - name: Spaces
    description: Authorized Personal and Shared financial contexts.
  - name: Categories
    description: Active and historical categories.
  - name: Budgets
    description: Recurring category budgets.
  - name: Category rules
    description: Exact-description rules.
  - name: Transactions
    description: Manual and imported expenses.
  - name: Statement imports
    description: Reviewed import commits and history.
  - name: Category summaries
    description: Calendar-period spending summaries.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Whether the application is ready to serve requests.
          enum:
            - ok
            - error
          example: ok
        database:
          type: string
          description: Readiness state of the database dependency.
          enum:
            - ready
            - unavailable
          example: ready
      additionalProperties: false
      required:
        - status
        - database
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint User identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        name:
          type: string
          description: Display name synchronized from the identity provider.
          minLength: 1
          maxLength: 200
          pattern: \S
          example: Ada Lovelace
        email:
          type: string
          description: Primary verified email synchronized from the identity provider.
          format: email
          maxLength: 320
          example: ada@example.com
        createdAt:
          type: string
          description: UTC timestamp when the local User was created.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        updatedAt:
          type: string
          description: UTC timestamp when the local User was last updated.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      additionalProperties: false
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - INVALID_JSON
        - NOT_ACCEPTABLE
        - UNSUPPORTED_MEDIA_TYPE
        - ROUTE_NOT_FOUND
        - HTTP_ERROR
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - UNAUTHENTICATED
        - USER_NOT_PROVISIONED
        - CONFLICT
        - STALE_EDIT
        - RESOURCE_NOT_FOUND
        - USER_NOT_FOUND
        - SPACE_NOT_FOUND
        - SPACE_NOT_WRITABLE
        - SPACE_NOTIFICATION_NOT_FOUND
        - INVITATION_ALREADY_PENDING
        - INVITATION_INELIGIBLE
        - INVITATION_CODE_UNAVAILABLE
        - INVITATION_CODE_RATE_LIMITED
        - INVITATION_CLAIM_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - CATEGORY_NOT_FOUND
        - CATEGORY_NAME_ALREADY_EXISTS
        - CATEGORY_INACTIVE
        - BUDGET_NOT_FOUND
        - CATEGORY_RULE_NOT_FOUND
        - CATEGORY_RULE_PATTERN_ALREADY_EXISTS
        - TRANSACTION_NOT_FOUND
        - STATEMENT_IMPORT_NOT_FOUND
        - IMPORTED_TRANSACTION_IMMUTABLE
        - STATEMENT_IMPORT_FILE_ALREADY_EXISTS
        - STATEMENT_IMPORT_FILE_HASH_INVALID
        - STATEMENT_IMPORT_PROBABLE_DUPLICATES
      description: Stable error code. Human-readable messages are not a compatibility contract.
    ErrorResponseDto:
      type: object
      properties:
        code:
          description: Stable error code. Human-readable messages are not a compatibility contract.
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Structured details for fields or domain-specific conflicts.
          items:
            oneOf:
              - $ref: '#/components/schemas/ErrorDetailDto'
              - $ref: '#/components/schemas/ProbableDuplicateDetailDto'
              - $ref: '#/components/schemas/CategoryEligibilityDetailDto'
      additionalProperties: false
      required:
        - code
        - message
        - details
    ErrorEnvelopeDto:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseDto'
      additionalProperties: false
      required:
        - error
    ErrorDetailCode:
      type: string
      enum:
        - required
        - invalid_format
        - invalid_type
        - invalid_value
        - unknown
        - incompatible
        - not_allowed
        - not_unique
        - too_short
        - too_long
        - probable_duplicate
      description: Stable machine-readable field-detail code.
    ErrorDetailDto:
      type: object
      properties:
        categoryId:
          type: string
          description: Conflicting owned Category identifier for a category-rule duplicate.
          pattern: ^[1-9]\d*$
          example: '42'
        field:
          type: string
          description: JSON Pointer into the request.
          example: /email
        code:
          description: Stable machine-readable field-detail code.
          allOf:
            - $ref: '#/components/schemas/ErrorDetailCode'
        message:
          type: string
          description: Human-readable detail message.
      additionalProperties: false
      required:
        - field
        - code
        - message
    ProbableDuplicateDetailDto:
      type: object
      properties:
        field:
          type: string
          example: /transactions/0
        code:
          type: string
          enum:
            - probable_duplicate
        message:
          type: string
        transactionIndexes:
          type: array
          items:
            type: integer
            minimum: 0
        committedTransactionIds:
          type: array
          description: Public transaction IDs encoded as strings.
          items:
            type: string
            pattern: ^[1-9]\d*$
      additionalProperties: false
      required:
        - field
        - code
        - message
        - transactionIndexes
        - committedTransactionIds
    CategoryEligibilityDetailDto:
      type: object
      properties:
        field:
          type: string
          example: /transactions/0/categoryId
        code:
          type: string
          enum:
            - category_inactive
        message:
          type: string
        categoryId:
          type: string
          description: The inactive Category assigned to the reviewed rows.
          pattern: ^[1-9]\d*$
          example: '42'
        transactionIndexes:
          type: array
          description: Zero-based reviewed Transaction indexes requiring correction.
          items:
            type: integer
            minimum: 0
      additionalProperties: false
      required:
        - field
        - code
        - message
        - categoryId
        - transactionIndexes
    CategoryResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Positive bigint Category identifier encoded as a string.
          pattern: ^[1-9]\d*$
          example: '42'
        name:
          type: string
          description: Trimmed Category display name. Uniqueness is checked case-insensitively.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Dining Out
        description:
          type: string
          description: Trimmed Category description, or null when no description is set.
          nullable: true
          maxLength: 500
          example: Restaurants and cafes
        color:
          type: string
          enum:
            - coral
            - scarlet
            - crimson
            - rose
            - magenta
            - orchid
            - plum
            - violet
            - indigo
            - cobalt
            - azure
            - sky
            - cyan
            - teal
            - emerald
            - forest
            - lime
            - olive
            - gold
            - amber
            - copper
            - cocoa
            - slate
            - steel
          description: Effective Category Color palette identifier. An explicitly saved choice is returned as-is; Categories without a saved choice receive a stable identity-based default.
          example: teal
        isActive:
          type: boolean
          description: Whether the Category is active. Inactive Categories retain their historical relationships and cannot receive a new Budget, although an existing Budget may still be replaced.
          example: true
        createdAt:
          type: string
          description: UTC timestamp when the Category was created.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
        updatedAt:
          type: string
          description: UTC timestamp when the Category was last updated.
          format: date-time
          example: '2026-08-29T00:00:00.000Z'
      description: A Category owned by the authenticated User. Inactive Categories retain their historical relationships.
      additionalProperties: false
      required:
        - id
        - name
        - description
        - color
        - isActive
        - createdAt
        - updatedAt
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Category display name. It is trimmed before storage and uniqueness checking; uniqueness is case-insensitive.
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Dining Out
        description:
          type: string
          description: Optional Category description. Leading and trailing whitespace is removed; blank text is stored as null.
          nullable: true
          maxLength: 500
