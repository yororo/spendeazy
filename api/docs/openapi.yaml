        - name: categoryId
          required: true
          in: path
          description: Positive bigint identifier encoded as a decimal JSON string.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '42'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBudgetDto'
      responses:
        '200':
          description: Budget replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponseDto'
        '201':
          description: Budget created.
          headers:
            Location:
              required: true
              description: Relative canonical URI of the created Budget.
              schema:
                type: string
                example: /api/v1/users/me/categories/42/budget
          content:
            application/json:
