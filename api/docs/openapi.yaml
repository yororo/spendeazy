  /api/v1/users/me/category-summaries:
    get:
      description: Active categories are included even with no spending; inactive categories remain only when they have spending, and results are ordered by category ID. The month requirement depends on period and is enforced at runtime because OpenAPI cannot express that cross-field rule. Unknown query parameters are rejected.
      operationId: CategorySummaries_getCategorySummary
      parameters:
        - name: period
          required: true
          in: query
          description: Calendar period. Monthly summaries require month and yearly summaries do not accept month.
          schema:
            example: monthly
            type: string
            enum:
              - monthly
              - yearly
        - name: year
          required: true
          in: query
          description: Four-digit calendar year used for the summary.
          schema:
            pattern: ^\d{4}$
            example: '2026'
            type: string
        - name: month
          required: false
          in: query
          description: Required for monthly summaries; forbidden for yearly summaries.
          schema:
            pattern: ^(0[1-9]|1[0-2])$
            example: '08'
            type: string
      responses:
        '200':
          description: Category summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySummaryResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UserNotProvisionedError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Get a complete monthly or yearly calendar-period summary.
      tags:
        - Category summaries
