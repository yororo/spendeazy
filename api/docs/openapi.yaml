          minLength: 1
          maxLength: 500
          pattern: \S
          example: Green Market
        categoryId:
          type: string
          description: Positive bigint Category identifier encoded as a decimal JSON string. Reassignment requires an active Category in the destination Space; an inactive Category causes a conflict.
          pattern: ^[1-9]\d*$
