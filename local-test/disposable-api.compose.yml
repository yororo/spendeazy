services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendeazy_disposable
      POSTGRES_USER: spendeazy
      POSTGRES_PASSWORD: ${SPENDEAZY_DB_PASSWORD:-not-started}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U spendeazy -d spendeazy_disposable"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${SPENDEAZY_API_IMAGE:-spendeazy-disposable-unconfigured:local}
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://spendeazy:${SPENDEAZY_DB_PASSWORD:-not-started}@postgres:5432/spendeazy_disposable
      INVITATION_CODE_ENCRYPTION_KEY: ${SPENDEAZY_INVITE_KEY:-}
      GCASH_REFERENCE_HASH_KEY: ${SPENDEAZY_REFERENCE_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
