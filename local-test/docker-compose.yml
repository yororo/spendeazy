services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${SPENDEAZY_TEST_DB_NAME:-spendeazy_test_db}
      POSTGRES_USER: ${SPENDEAZY_TEST_DB_USER:-spendeazy_test_user}
      POSTGRES_PASSWORD: ${SPENDEAZY_TEST_DB_PASSWORD:-spendeazy_local_test_password}
    ports:
      - "127.0.0.1:${SPENDEAZY_TEST_DB_PORT:-55432}:5432"
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  test-data:
    name: ${SPENDEAZY_TEST_DB_VOLUME:-spendeazy-local-test-data}
