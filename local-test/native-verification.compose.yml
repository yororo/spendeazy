# Owned native-verification stack. The database volume outlives API replacement.
# Run identity is passed in by scripts/native-verification.mjs. Do not point this file
# at personal environment files.

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${SPENDEAZY_NV_DB_NAME}
      POSTGRES_USER: ${SPENDEAZY_NV_DB_USER}
      POSTGRES_PASSWORD: ${SPENDEAZY_NV_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SPENDEAZY_NV_DB_PORT}:5432"
      - "127.0.0.1:${SPENDEAZY_NV_API_PORT}:3000"
    volumes:
      - database:/var/lib/postgresql/data
    labels:
      io.spendeazy.native-verification/run-id: ${SPENDEAZY_NV_RUN_ID}
      io.spendeazy.native-verification/ownership-token: ${SPENDEAZY_NV_OWNERSHIP_TOKEN}
      io.spendeazy.native-verification/role: database
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${SPENDEAZY_NV_API_IMAGE}
    restart: "no"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${SPENDEAZY_NV_DB_USER}:${SPENDEAZY_NV_DB_PASSWORD}@127.0.0.1:5432/${SPENDEAZY_NV_DB_NAME}
      INVITATION_CODE_ENCRYPTION_KEY: ${SPENDEAZY_NV_INVITE_KEY}
      GCASH_REFERENCE_HASH_KEY: ${SPENDEAZY_NV_REFERENCE_KEY}
    env_file:
      - ${SPENDEAZY_NV_RUNTIME_ENV_FILE}
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      io.spendeazy.native-verification/run-id: ${SPENDEAZY_NV_RUN_ID}
      io.spendeazy.native-verification/ownership-token: ${SPENDEAZY_NV_OWNERSHIP_TOKEN}
      io.spendeazy.native-verification/role: api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

volumes:
  database:
    name: ${SPENDEAZY_NV_PROJECT}-database
    labels:
      io.spendeazy.native-verification/run-id: ${SPENDEAZY_NV_RUN_ID}
      io.spendeazy.native-verification/ownership-token: ${SPENDEAZY_NV_OWNERSHIP_TOKEN}
      io.spendeazy.native-verification/role: database

networks:
  default:
    name: ${SPENDEAZY_NV_PROJECT}-network
    labels:
      io.spendeazy.native-verification/run-id: ${SPENDEAZY_NV_RUN_ID}
      io.spendeazy.native-verification/ownership-token: ${SPENDEAZY_NV_OWNERSHIP_TOKEN}
      io.spendeazy.native-verification/role: network
